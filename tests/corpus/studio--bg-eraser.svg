    <rect x="174" y="448" width="30" height="42"/>
    <rect x="174" y="448" width="42" height="30"/>
  </g>
  <rect x="48" y="322" width="168" height="168" rx="12" fill="none" stroke="rgb(60, 60, 60)" stroke-width="10"/>
  <!-- The eraser, as eraser.svg has it, drawn a little smaller toward the
       top right so the patch shows. -->
