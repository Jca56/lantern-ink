    <rect x="236" y="304" width="30" height="8" rx="3" fill="#8ab0d8"/>
    <line x1="88" y1="338.824" x2="145" y2="338.824" stroke="#fff" stroke-linecap="round" style="stroke-width: 7px; opacity: 0.48;"/>
