<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="38.214 104.671 407.708 392.329" width="512" height="512" preserveAspectRatio="none">
  <defs>
    <linearGradient id="eraserPink" x1="0%" y1="0%" x2="0%" y2="100%" gradientTransform="rotate(-35)">
      <stop offset="0" stop-color="rgb(255, 167, 230)"/>
      <stop offset="1" stop-color="rgb(148, 23, 65)"/>
    </linearGradient>
    <linearGradient id="eraserPinkDark" x1="0%" y1="0%" x2="0%" y2="100%" gradientTransform="rotate(-35)">
      <stop offset="0" stop-color="rgb(255, 167, 230)"/>
      <stop offset="1" stop-color="rgb(189, 99, 134)"/>
    </linearGradient>
    <linearGradient id="bandBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0" stop-color="rgb(116, 178, 255)"/>
      <stop offset="1" stop-color="rgb(11, 40, 86)"/>
    </linearGradient>
  </defs>
  <!-- What it leaves behind: a patch of the transparency checkerboard. -->
  <rect x="48" y="322" width="168" height="168" rx="12" fill="#dff5ff"/>
  <g fill="#7397b8">
    <rect x="48" y="322" width="42" height="42" rx="12"/>
    <rect x="60" y="322" width="30" height="42"/>
    <rect x="48" y="334" width="42" height="30"/>
    <rect x="132" y="322" width="42" height="42"/>
    <rect x="90" y="364" width="42" height="42"/>
    <rect x="174" y="364" width="42" height="42"/>
    <rect x="48" y="406" width="42" height="42"/>
    <rect x="132" y="406" width="42" height="42"/>
    <rect x="90" y="448" width="42" height="42"/>
