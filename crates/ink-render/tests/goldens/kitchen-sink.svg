<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="192" height="192">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241a0f"/>
      <stop offset="1" stop-color="#12100e"/>
    </linearGradient>
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="10" y1="0" x2="30" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#ffc800"/>
      <stop offset="1" stop-color="#e94560"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5" fx="0.3" fy="0.3">
      <stop offset="0" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="0.6" stop-color="#29adff"/>
      <stop offset="1" stop-color="#83769c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="again" href="#gold" gradientTransform="rotate(90 20 20)" spreadMethod="repeat"/>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <clipPath id="window">
      <circle cx="70" cy="26" r="15"/>
      <rect x="52" y="30" width="36" height="14" rx="3" clip-path="url(#slit)"/>
    </clipPath>
    <clipPath id="slit" clipPathUnits="objectBoundingBox">
      <rect x="0.1" y="0" width="0.8" height="1"/>
    </clipPath>
  </defs>
  <rect width="96" height="96" rx="10" fill="url(#sky)"/>
  <g filter="url(#shadow)">
    <rect x="8" y="8" width="30" height="24" rx="5" ry="3" fill="url(#gold)" stroke="#e8dcc8" stroke-width="1.5"/>
  </g>
  <g clip-path="url(#window)">
    <rect x="50" y="6" width="40" height="40" fill="url(#glow)"/>
    <path d="M52 44 L88 8" stroke="#a8e72e" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g opacity="0.75" transform="translate(8 40)">
    <path d="M0 20 C8 0 16 0 24 20 S40 40 48 20" fill="none" stroke="url(#again)" stroke-width="4" stroke-linejoin="round" stroke-linecap="square"/>
    <path d="M0 20 C8 0 16 0 24 20 S40 40 48 20" fill="none" stroke="#12100e" stroke-width="1" stroke-dasharray="3 2 0.5 2" stroke-dashoffset="1" stroke-linecap="round"/>
  </g>
  <path d="M60 56 l14 0 l-11 9 l4 -14 l4 14 z" fill="#ff77a8" fill-rule="evenodd" stroke="#12100e" stroke-width="0.75" stroke-linejoin="miter" stroke-miterlimit="2"/>
  <path d="M78 56 l14 0 l-11 9 l4 -14 l4 14 z" fill="#ff77a8" stroke="#e8dcc8" stroke-width="2" paint-order="stroke" stroke-linejoin="bevel"/>
  <g transform="translate(20 82) rotate(-12) skewX(20) scale(1.2 0.8)" style="fill: #29adff; fill-opacity: 0.8">
    <polygon points="0,-8 7,6 -7,6"/>
    <ellipse cx="14" cy="0" rx="6" ry="3" visibility="hidden"/>
    <circle cx="24" cy="0" r="4" fill="none" stroke="#f0c040" stroke-width="1.5" stroke-dasharray="2"/>
  </g>
  <line x1="56" y1="80" x2="90" y2="80" stroke="rgb(240 192 64 / 60%)" stroke-width="0.5"/>
  <polyline points="56,86 62,90 68,84 74,90 80,84 86,90" fill="none" stroke="hsl(84 79% 54%)" stroke-width="1.25" stroke-linejoin="round" opacity="0.5"/>
  <path d="M58 70 A6 3 30 1 0 70 70 A6 3 30 0 0 58 70 Z" fill="#83769c" display="inline"/>
  <rect x="0" y="0" width="96" height="96" fill="red" display="none"/>
</svg>
