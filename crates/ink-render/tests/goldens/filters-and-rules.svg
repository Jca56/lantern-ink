<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120">
  <!-- What M3b taught the renderer: filters that are chains of steps,
       and <style> rules. Looked at, compared against rsvg-convert, kept. -->
  <style>
    /* by class, by id, nested directly and somewhere inside, by name */
    .warm { fill: #ffb000 }
    #cool { fill: #2a9df4; stroke: #0b3a5e; stroke-width: 2 }
    g.dim > rect { fill: #5a4a3a }
    .dim .lit { fill: #ffe9a8 }
    circle { stroke: #12100e }
    .warm.loud { fill: #ff2e5b !important }
  </style>
  <defs>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="boxy" color-interpolation-filters="sRGB" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur in="SourceAlpha" stdDeviation="2"/><feOffset dx="4" dy="4"/><feComponentTransfer result="offsetblur"><feFuncA type="linear" slope="0.8"/></feComponentTransfer><feFlood flood-color="#30005a" flood-opacity="0.6"/><feComposite in2="offsetblur" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="ring" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur in="SourceAlpha" stdDeviation="2.5" result="soft"/><feComposite in="soft" in2="SourceAlpha" operator="out" result="halo"/><feFlood flood-color="#ff4d6e"/><feComposite in2="halo" operator="in"/></filter>
    <filter id="wash"><feComponentTransfer><feFuncR type="table" tableValues="1 0"/><feFuncG type="gamma" exponent="2"/><feFuncB type="discrete" tableValues="0 0.5 1"/></feComponentTransfer></filter>
    <filter id="mix" x="0" y="0" width="1" height="1"><feFlood flood-color="#00c2a8" flood-opacity="0.5" result="f"/><feComposite in="SourceGraphic" in2="f" operator="arithmetic" k1="0" k2="0.7" k3="0.6" k4="0"/></filter>
  </defs>
  <rect width="160" height="120" fill="#201a14"/>
  <circle class="warm" cx="25" cy="25" r="12" filter="url(#blur)"/>
  <circle class="warm loud" cx="65" cy="25" r="10" filter="url(#glow)" style="fill: #fff"/>
  <rect id="cool" x="95" y="12" width="26" height="26" rx="6" filter="url(#boxy)" fill="#f00"/>
  <path d="M135 12 l14 26 h-28 z" fill="#fff" filter="url(#ring)"/>
  <g class="dim" transform="translate(10 60)">
    <rect width="40" height="40" rx="4"/>
    <g><rect class="lit" x="8" y="8" width="24" height="24" rx="2"/></g>
  </g>
  <g filter="url(#wash)" transform="translate(64 60)"><rect width="40" height="40" fill="#c08040"/><circle cx="20" cy="20" r="12" fill="#40a0ff"/></g>
  <rect x="116" y="60" width="36" height="40" rx="8" fill="#ff8a3d" filter="url(#mix)" transform="rotate(8 134 80)"/>
</svg>
